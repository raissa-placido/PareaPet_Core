{% load static %}

<html lang="pt-br">

    <title>{% block title %}PareaPet{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/pets.css' %}">
</head>
<body>
    <header class="site-header">
        <div class="header-content">
            <a class="brand" href="{% url 'listar_pets' %}">PareaPet</a>

                <a href="{% url 'listar_pets' %}">Pets</a>
                <a href="{% url 'adicionar_pet' %}">Cadastrar pet</a>

        </div>

    <main class="container">

</html>
