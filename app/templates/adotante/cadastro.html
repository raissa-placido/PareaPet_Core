{% extends "adotante/base.html" %}
{% block title %}Criar conta | Parêa Pet{% endblock %}
{% block content %}
<section class="mx-auto max-w-xl rounded-3xl bg-white p-7 shadow-sm sm:p-10">
    <p class="font-bold uppercase tracking-widest text-[#64884a]">Cadastro de adotante</p>
    <h1 class="mt-2 text-3xl font-extrabold text-[#34482c]">Vamos nos conhecer?</h1>
    <p class="mt-3 text-[#62705e]">Crie seu acesso para começar a montar seu perfil.</p>
    {% if erro %}<div role="alert" class="mt-5 rounded-xl border border-red-200 bg-red-50 p-4 text-red-800">{{ erro }}</div>{% endif %}
    <form method="post" action="{% url 'usuario_pp:PreCadastro' %}" class="mt-7 space-y-5">
        {% csrf_token %}
        <div>
            <label for="nome" class="mb-2 block font-semibold">Nome completo</label>
            <input id="nome" name="nome" type="text" autocomplete="name" required value="{{ request.POST.nome }}" class="w-full rounded-xl border border-[#cbd7c3] px-4 py-3 outline-none focus:border-[#64884a] focus:ring-2 focus:ring-[#64884a]/20">
        </div>
        <div>
            <label for="email" class="mb-2 block font-semibold">E-mail</label>
            <input id="email" name="email" type="email" autocomplete="email" required value="{{ request.POST.email }}" class="w-full rounded-xl border border-[#cbd7c3] px-4 py-3 outline-none focus:border-[#64884a] focus:ring-2 focus:ring-[#64884a]/20">
        </div>
        <div>
            <label for="senha" class="mb-2 block font-semibold">Senha</label>
            <input id="senha" name="senha" type="password" autocomplete="new-password" required class="w-full rounded-xl border border-[#cbd7c3] px-4 py-3 outline-none focus:border-[#64884a] focus:ring-2 focus:ring-[#64884a]/20">
        </div>
        <div>
            <label for="confirmarSenha" class="mb-2 block font-semibold">Confirme sua senha</label>
            <input id="confirmarSenha" name="confirmarSenha" type="password" autocomplete="new-password" required class="w-full rounded-xl border border-[#cbd7c3] px-4 py-3 outline-none focus:border-[#64884a] focus:ring-2 focus:ring-[#64884a]/20">
        </div>
        <button type="submit" class="w-full rounded-xl bg-[#64884a] px-5 py-3 font-bold text-white hover:bg-[#4f7038]">Criar minha conta</button>
    </form>
    <p class="mt-6 text-center text-[#62705e]">Já tem cadastro? <a href="{% url 'usuario_pp:login' %}" class="font-bold text-[#557a3c] underline">Entrar</a></p>
</section>
{% endblock %}
