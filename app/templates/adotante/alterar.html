{% extends "adotante/base.html" %}
{% block title %}Alterar dados | Parêa Pet{% endblock %}
{% block content %}
<section class="mx-auto max-w-3xl rounded-3xl bg-white p-7 shadow-sm sm:p-10">
    <a href="{% url 'usuario_pp:perfil_usuario' %}" class="font-semibold text-[#557a3c] underline">← Voltar ao perfil</a>
    <p class="mt-7 font-bold uppercase tracking-widest text-[#64884a]">Meu perfil</p>
    <h1 class="mt-2 text-3xl font-extrabold text-[#34482c]">Alterar dados</h1>
    {% if erro %}<div role="alert" class="mt-5 rounded-xl border border-red-200 bg-red-50 p-4 text-red-800">{{ erro }}</div>{% endif %}
    <form method="post" action="{% url 'usuario_pp:alterar_cadastro' %}" class="mt-7 grid gap-5 sm:grid-cols-2">
        {% csrf_token %}
        <div><label for="nome" class="mb-2 block font-semibold">Nome completo</label><input id="nome" name="nome" value="{{ adotante.nome }}" required class="w-full rounded-xl border border-[#cbd7c3] px-4 py-3"></div>
        <div><label for="email" class="mb-2 block font-semibold">E-mail</label><input id="email" name="email" type="email" value="{{ adotante.email }}" required class="w-full rounded-xl border border-[#cbd7c3] px-4 py-3"></div>
        <div><label for="cpf" class="mb-2 block font-semibold">CPF</label><input id="cpf" name="cpf" value="{{ adotante.cpf|default:'' }}" class="w-full rounded-xl border border-[#cbd7c3] px-4 py-3"></div>
        <div><label for="data_nascimento" class="mb-2 block font-semibold">Data de nascimento</label><input id="data_nascimento" name="data_nascimento" type="date" value="{{ adotante.data_nascimento|date:'Y-m-d' }}" class="w-full rounded-xl border border-[#cbd7c3] px-4 py-3"></div>
        <div><label for="telefone" class="mb-2 block font-semibold">Telefone</label><input id="telefone" name="telefone" value="{{ adotante.telefone|default:'' }}" class="w-full rounded-xl border border-[#cbd7c3] px-4 py-3"></div>
        <div><label for="cep" class="mb-2 block font-semibold">CEP</label><input id="cep" name="cep" value="{{ adotante.cep|default:'' }}" class="w-full rounded-xl border border-[#cbd7c3] px-4 py-3"></div>
        <div><label for="rua" class="mb-2 block font-semibold">Rua</label><input id="rua" name="rua" value="{{ adotante.rua|default:'' }}" class="w-full rounded-xl border border-[#cbd7c3] px-4 py-3"></div>
        <div><label for="numero" class="mb-2 block font-semibold">Número</label><input id="numero" name="numero" value="{{ adotante.numero|default:'' }}" class="w-full rounded-xl border border-[#cbd7c3] px-4 py-3"></div>
        <div><label for="bairro" class="mb-2 block font-semibold">Bairro</label><input id="bairro" name="bairro" value="{{ adotante.bairro|default:'' }}" class="w-full rounded-xl border border-[#cbd7c3] px-4 py-3"></div>
        <div><label for="cidade" class="mb-2 block font-semibold">Cidade</label><input id="cidade" name="cidade" value="{{ adotante.cidade|default:'' }}" class="w-full rounded-xl border border-[#cbd7c3] px-4 py-3"></div>
        <div class="sm:col-span-2"><label for="estado" class="mb-2 block font-semibold">Estado</label><select id="estado" name="estado" class="w-full rounded-xl border border-[#cbd7c3] bg-white px-4 py-3"><option value="">Selecione um estado</option>{% for codigo, descricao in estados %}<option value="{{ codigo }}" {% if adotante.estado and adotante.estado.codigo == codigo %}selected{% endif %}>{{ descricao }}</option>{% endfor %}</select></div>
        <div class="flex flex-wrap justify-end gap-3 pt-3 sm:col-span-2">
            <a href="{% url 'usuario_pp:perfil_usuario' %}" class="rounded-xl border border-[#64884a] px-5 py-3 font-bold text-[#557a3c]">Cancelar</a>
            <button type="submit" class="rounded-xl bg-[#64884a] px-6 py-3 font-bold text-white hover:bg-[#4f7038]">Salvar alterações</button>
        </div>
    </form>
</section>
{% endblock %}
