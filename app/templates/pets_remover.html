{% extends "pets_base.html" %}

{% block title %}Excluir pet | PareaPet{% endblock %}

{% block content %}
<section class="card">
    <h1>Excluir pet</h1>
    <p class="subtitle">Esta ação não pode ser desfeita.</p>
    {% if ERRO %}<div class="error-message" role="alert">{{ ERRO }}</div>{% endif %}
    <p>Deseja realmente excluir o pet <strong>{{ pet.nome }}</strong>?</p>
    <div class="form-actions">
        <form method="post">
            {% csrf_token %}
            <button class="danger" type="submit">Confirmar exclusão</button>
        </form>
        <a class="button secondary" href="{% url 'listar_pets' %}">Cancelar</a>
    </div>
</section>
{% endblock %}
